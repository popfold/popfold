# A release tag (vX.Y.Z, from `pnpm release`): build the library bundle and attach it to a GitHub release, so a page
# without a build step can take dist/popfold.js and its cases/ as they are (popfold-X.Y.Z.zip).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - name: The bundle, zipped, on the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && zip -qr "../popfold-${TAG#v}.zip" .)
          notes="Popfold ${TAG#v}. popfold-${TAG#v}.zip is the library bundle: popfold.js and cases/, for a page without a build step (README, 'Without a build step'). The changes are in CHANGELOG.md."
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Popfold ${TAG#v}" --notes "$notes" --prerelease
          gh release upload "$TAG" "popfold-${TAG#v}.zip" --clobber
