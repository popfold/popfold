# Checks every push and pull request: install, typecheck Popfold and the template, run the unit tests, build the
# templates, and open each template in a browser to look for mistakes (popfold check; no GPU, so it draws in software).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # the pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm -r build
      - name: The library bundle (dist/popfold.js, for pages without a build step)
        run: pnpm build:lib
      - name: popfold check on the compact template
        working-directory: templates/compact
        run: pnpm exec popfold check
      - name: popfold check on the tower template
        working-directory: templates/tower
        run: pnpm exec popfold check
      - name: popfold check on the diorama template
        working-directory: templates/diorama
        run: pnpm exec popfold check
      - name: No machine paths
        run: |
          if grep -rnE "[A-Z]:[\\/](dev|Users)|/home/[a-z]+/|/Users/[A-Za-z]+/" . --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::a file holds a path from someone's machine"; exit 1
          fi
